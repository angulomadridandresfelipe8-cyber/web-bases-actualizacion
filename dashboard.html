<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Dashboard Comercial</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#eef2f7;
}

header{
    background:#002b45;
    color:white;
    padding:20px;
    font-size:22px;
    font-weight:bold;
}

.container{
    padding:30px;
}

.filtros{
    margin-bottom:20px;
    display:flex;
    gap:20px;
    align-items:center;
}

select, input{
    padding:8px;
}

.kpi-container{
    display:flex;
    gap:20px;
    margin-bottom:30px;
}

.kpi{
    flex:1;
    background:white;
    padding:20px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.kpi h3{
    margin:0;
    color:#555;
}

.kpi h2{
    margin:10px 0 0 0;
    color:#002b45;
}

.card{
    background:white;
    padding:20px;
    margin-bottom:30px;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

canvas{
    max-height:400px;
}
</style>
</head>

<body>

<header>
Reporte de Seguimiento Comercial
</header>

<div class="container">

<div class="filtros">
<input type="file" id="inputExcel">
<select id="filtroAnio">
<option value="">Todos los años</option>
</select>
<select id="filtroMes">
<option value="">Todos los meses</option>
</select>
</div>

<div class="kpi-container">
<div class="kpi">
<h3>Total Leads</h3>
<h2 id="kpiLeads">0</h2>
</div>

<div class="kpi">
<h3>Oportunidades Cerradas</h3>
<h2 id="kpiCierre">0</h2>
</div>

<div class="kpi">
<h3>Tasa de Cierre</h3>
<h2 id="kpiTasa">0%</h2>
</div>
</div>

<div class="card">
<canvas id="graficoVertical"></canvas>
</div>

<div class="card">
<canvas id="graficoComercial"></canvas>
</div>

<div class="card">
<canvas id="graficoLeads"></canvas>
</div>

</div>

<script>

let datosGlobal = [];
let chart1, chart2, chart3;

document.getElementById('inputExcel').addEventListener('change', function(e) {

const reader = new FileReader();

reader.onload = function(e) {

const data = new Uint8Array(e.target.result);
const workbook = XLSX.read(data, {type:'array'});
const sheet = workbook.Sheets[workbook.SheetNames[0]];
datosGlobal = XLSX.utils.sheet_to_json(sheet);

cargarFiltros(datosGlobal);
procesarDatos(datosGlobal);
};

reader.readAsArrayBuffer(e.target.files[0]);
});

function cargarFiltros(data){

let años = [...new Set(data.map(d => d["año"]).filter(Boolean))];
let meses = [...new Set(data.map(d => d["mes"]).filter(Boolean))];

let filtroAnio = document.getElementById("filtroAnio");
let filtroMes = document.getElementById("filtroMes");

años.forEach(a => {
let option = document.createElement("option");
option.value = a;
option.text = a;
filtroAnio.appendChild(option);
});

meses.forEach(m => {
let option = document.createElement("option");
option.value = m;
option.text = m;
filtroMes.appendChild(option);
});

filtroAnio.addEventListener("change", aplicarFiltros);
filtroMes.addEventListener("change", aplicarFiltros);
}

function aplicarFiltros(){

let anio = document.getElementById("filtroAnio").value;
let mes = document.getElementById("filtroMes").value;

let filtrado = datosGlobal.filter(d => {
return (anio === "" || d["año"] == anio) &&
(mes === "" || d["mes"] == mes);
});

procesarDatos(filtrado);
}

function procesarDatos(data){

let totalLeads = data.length;
let totalCerradas = 0;

let cierreVertical = {};
let ventasComercial = {};
let leadsVertical = {};

data.forEach(row => {

let vertical = row["Vertical"] || "Sin Vertical";
let estado = row["Estado de la Opp corregida"];
let comercial = row["COMERCIAL"] || "Sin Comercial";

if(!leadsVertical[vertical]){
leadsVertical[vertical] = 0;
}
leadsVertical[vertical]++;

if(estado === "Cerrada"){
totalCerradas++;

if(!cierreVertical[vertical]){
cierreVertical[vertical] = 0;
}
cierreVertical[vertical]++;

if(!ventasComercial[comercial]){
ventasComercial[comercial] = 0;
}
ventasComercial[comercial]++;
}
});

let tasa = totalLeads > 0 ? ((totalCerradas / totalLeads) * 100).toFixed(1) : 0;

document.getElementById("kpiLeads").innerText = totalLeads;
document.getElementById("kpiCierre").innerText = totalCerradas;
document.getElementById("kpiTasa").innerText = tasa + "%";

crearGrafico("graficoVertical", cierreVertical, "Cierre por Vertical", chart1);
crearGrafico("graficoComercial", ventasComercial, "Ventas por Comercial", chart2);
crearGrafico("graficoLeads", leadsVertical, "Volumen de Leads por Vertical", chart3);
}

function crearGrafico(id, datos, titulo, chartRef){

if(chartRef){
chartRef.destroy();
}

let ctx = document.getElementById(id).getContext("2d");

let nuevoChart = new Chart(ctx, {
type:'bar',
data:{
labels:Object.keys(datos),
datasets:[{
label:titulo,
data:Object.values(datos)
}]
},
options:{
responsive:true
}
});

if(id === "graficoVertical") chart1 = nuevoChart;
if(id === "graficoComercial") chart2 = nuevoChart;
if(id === "graficoLeads") chart3 = nuevoChart;
}

</script>

</body>
</html>
