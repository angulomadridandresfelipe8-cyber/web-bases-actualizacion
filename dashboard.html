<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Reporte de Seguimiento Comercial – Febrero</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#eef2f7;
}

header{
    background:#002b45;
    color:white;
    padding:20px;
    font-size:22px;
    font-weight:bold;
}

.container{
    padding:30px;
}

.filtros{
    margin-bottom:20px;
}

.kpi-container{
    display:flex;
    gap:20px;
    margin-bottom:30px;
}

.kpi{
    flex:1;
    background:white;
    padding:20px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.kpi h3{
    margin:0;
    color:#555;
}

.kpi h2{
    margin:10px 0 0 0;
    color:#002b45;
}

.card{
    background:white;
    padding:20px;
    margin-bottom:30px;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

canvas{
    max-height:400px;
}
</style>
</head>

<body>

<header>
Reporte de Seguimiento Comercial – Febrero
</header>

<div class="container">

<div class="filtros">
<input type="file" id="inputExcel">
</div>

<!-- KPIs -->
<div class="kpi-container">

<div class="kpi">
<h3>Total Leads</h3>
<h2 id="kpiLeads">0</h2>
</div>

<div class="kpi">
<h3>Oportunidades Cerradas</h3>
<h2 id="kpiCerradas">0</h2>
</div>

<div class="kpi">
<h3>Tasa de Cierre</h3>
<h2 id="kpiTasa">0%</h2>
</div>

<div class="kpi">
<h3>Oportunidades Calificadas</h3>
<h2 id="kpiCalificadas">0</h2>
</div>

</div>

<!-- GRÁFICOS -->

<div class="card">
<h3>1. Cierre por Vertical (%)</h3>
<canvas id="graficoCierreVertical"></canvas>
</div>

<div class="card">
<h3>2. Volumen de Leads por Vertical</h3>
<canvas id="graficoLeadsVertical"></canvas>
</div>

<div class="card">
<h3>3. Ventas por Comercial</h3>
<canvas id="graficoComercial"></canvas>
</div>

</div>

<script>

let datosGlobal = [];
let chart1, chart2, chart3;

document.getElementById('inputExcel').addEventListener('change', function(e) {

const reader = new FileReader();

reader.onload = function(e) {

const data = new Uint8Array(e.target.result);
const workbook = XLSX.read(data, {type:'array'});
const sheet = workbook.Sheets[workbook.SheetNames[0]];
datosGlobal = XLSX.utils.sheet_to_json(sheet);

procesarDatos(datosGlobal);
};

reader.readAsArrayBuffer(e.target.files[0]);
});

function procesarDatos(data){

let totalLeads = data.length;
let totalCerradas = 0;
let totalCalificadas = 0;

let leadsVertical = {};
let cierreVertical = {};
let ventasComercial = {};

data.forEach(row => {

let vertical = row["Vertical"] || "Sin Vertical";
let estado = row["Estado de la Opp corregida"] || "";
let comercial = row["COMERCIAL"] || "Sin Comercial";

if(!leadsVertical[vertical]) leadsVertical[vertical] = 0;
leadsVertical[vertical]++;

if(estado.toLowerCase().includes("calificada")){
totalCalificadas++;
}

if(estado.toLowerCase().includes("cerrada")){
totalCerradas++;

if(!cierreVertical[vertical]) cierreVertical[vertical] = 0;
cierreVertical[vertical]++;

if(!ventasComercial[comercial]) ventasComercial[comercial] = 0;
ventasComercial[comercial]++;
}
});

let tasaCierre = totalLeads > 0 ? ((totalCerradas/totalLeads)*100).toFixed(1) : 0;

// Actualizar KPIs
document.getElementById("kpiLeads").innerText = totalLeads;
document.getElementById("kpiCerradas").innerText = totalCerradas;
document.getElementById("kpiTasa").innerText = tasaCierre + "%";
document.getElementById("kpiCalificadas").innerText = totalCalificadas;

// Convertir cierre por vertical a %
let cierrePorcentaje = {};
Object.keys(leadsVertical).forEach(v => {
let cerradas = cierreVertical[v] || 0;
let total = leadsVertical[v];
cierrePorcentaje[v] = total > 0 ? ((cerradas/total)*100).toFixed(1) : 0;
});

crearGrafico("graficoCierreVertical", cierrePorcentaje, "Cierre % por Vertical", chart1);
crearGrafico("graficoLeadsVertical", leadsVertical, "Leads por Vertical", chart2);
crearGrafico("graficoComercial", ventasComercial, "Ventas por Comercial", chart3);

}

function crearGrafico(id, datos, titulo, chartRef){

if(chartRef){
chartRef.destroy();
}

let ctx = document.getElementById(id).getContext("2d");

let nuevoChart = new Chart(ctx, {
type:'bar',
data:{
labels:Object.keys(datos),
datasets:[{
label:titulo,
data:Object.values(datos)
}]
},
options:{
responsive:true,
plugins:{
legend:{display:false}
}
}
});

if(id === "graficoCierreVertical") chart1 = nuevoChart;
if(id === "graficoLeadsVertical") chart2 = nuevoChart;
if(id === "graficoComercial") chart3 = nuevoChart;
}

</script>

</body>
</html>
