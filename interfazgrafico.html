<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Reporte Seguimiento Comercial</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    font-family: Arial;
    background:#f4f6f9;
    padding:30px;
}
h2{
    color:#003366;
}
.card{
    background:white;
    padding:20px;
    margin-bottom:30px;
    border-radius:10px;
    box-shadow:0px 3px 10px rgba(0,0,0,0.1);
}
</style>
</head>

<body>

<h2>Reporte de Seguimiento Comercial – Febrero</h2>

<input type="file" id="inputExcel" />

<div class="card">
<canvas id="graficoVertical"></canvas>
</div>

<div class="card">
<canvas id="graficoComercial"></canvas>
</div>

<script>

document.getElementById('inputExcel').addEventListener('change', function(e) {

    const reader = new FileReader();

    reader.onload = function(e) {

        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, {type:'array'});
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const jsonData = XLSX.utils.sheet_to_json(sheet);

        generarGraficos(jsonData);
    };

    reader.readAsArrayBuffer(e.target.files[0]);
});

function generarGraficos(data){

    let cierreVertical = {};
    let ventasComercial = {};

    data.forEach(row => {

        let vertical = row["Vertical"];
        let estado = row["Estado de la Opp corregida"];
        let comercial = row["COMERCIAL"];

        if(estado === "Cerrada"){

            if(!cierreVertical[vertical]){
                cierreVertical[vertical] = 0;
            }
            cierreVertical[vertical]++;

            if(!ventasComercial[comercial]){
                ventasComercial[comercial] = 0;
            }
            ventasComercial[comercial]++;
        }
    });

    crearGrafico("graficoVertical",
        Object.keys(cierreVertical),
        Object.values(cierreVertical),
        "Cierre por Vertical"
    );

    crearGrafico("graficoComercial",
        Object.keys(ventasComercial),
        Object.values(ventasComercial),
        "Ventas Cerradas por Comercial"
    );
}

function crearGrafico(id, labels, datos, titulo){

    new Chart(document.getElementById(id), {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                label: titulo,
                data: datos
            }]
        }
    });
}

</script>

</body>
</html>
